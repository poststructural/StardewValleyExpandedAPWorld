name: ci

on:
  push:
  pull_request:

jobs:
  world:
    name: world (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      # patches are LF; Windows runners default to autocrlf=true, which would make them fail to apply
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned upstream sources
        run: python scripts/fetch_upstream.py

      - name: Apply patches
        run: python scripts/apply_patches.py

      - name: Build apworld
        run: python scripts/build_world.py

      - name: Our own tests
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      # The build/mod half needs the game's DLLs, so CI skips build_mod.py and package_release.py.
      #
      # World tests run the way Archipelago's CI runs them (pip install requirements + ci-requirements, then
      # pytest from the Archipelago checkout), scoped to worlds/stardew_valley/test. We run the whole folder in
      # parallel (-n auto) except long/ and performance/, which are slow stress and timing tests that upstream
      # also keeps out of its default run. content/, mods/ (includes TestSVE) and the generation tests all run.
      - name: Install Archipelago test dependencies
        working-directory: .cache/archipelago
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r ci-requirements.txt

      - name: Archipelago settings
        working-directory: .cache/archipelago
        run: python Launcher.py --update_settings

      - name: Stardew Valley world tests
        working-directory: .cache/archipelago
        run: >
          python -m pytest worlds/stardew_valley/test -n auto
          --ignore=worlds/stardew_valley/test/long
          --ignore=worlds/stardew_valley/test/performance

      - uses: actions/upload-artifact@v4
        with:
          name: stardew_valley-apworld-${{ matrix.os }}
          path: artifacts/stardew_valley.apworld
          if-no-files-found: error
